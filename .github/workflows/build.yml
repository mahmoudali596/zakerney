name: Build Zakerney APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack source
        run: |
          echo "$SRC" | base64 -d | tar xJ
          python3 zakerney/tool/gen_alarm.py zakerney/assets/sounds/alarm.wav
        env:
          SRC: 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - name: Build
        working-directory: zakerney
        run: |
          bash setup.sh
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle*
          grep -n minSdk android/app/build.gradle*
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zakerney-apk
          path: zakerney/build/app/outputs/flutter-apk/app-release.apk
