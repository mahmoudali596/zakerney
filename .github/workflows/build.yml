name: Build Zakerney APK
on: [push, workflow_dispatch]
env:
  PATCH: 
  SRC: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack source
        run: |
          echo "$SRC" | base64 -d | tar xJ
          python3 zakerney/tool/gen_alarm.py zakerney/assets/sounds/alarm.wav
          sed -i 's/record: ^5.1.2/record: ^6.1.1/' zakerney/pubspec.yaml
          (cd zakerney && echo "$PATCH" | base64 -d | xz -d | patch -p1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - name: Build
        working-directory: zakerney
        run: |
          bash setup.sh
          for i in 1 2 3 4; do flutter build apk --release && break; echo "retry $i"; sleep 30; done
          test -f build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zakerney-apk
          path: zakerney/build/app/outputs/flutter-apk/app-release.apk
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unpack source
        run: |
          echo "$SRC" | base64 -d | tar xJ
          python3 zakerney/tool/gen_alarm.py zakerney/assets/sounds/alarm.wav
          sed -i 's/record: ^5.1.2/record: ^6.1.1/' zakerney/pubspec.yaml
          (cd zakerney && echo "$PATCH" | base64 -d | xz -d | patch -p1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - name: Prepare tests
        working-directory: zakerney
        run: |
          bash setup.sh
          bash tool/e2e/prepare.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash zakerney/tool/e2e/run_e2e.sh
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p zakerney/screenshots && cd zakerney/screenshots
          git init -q && git checkout -q -b test-results
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Test results $GITHUB_RUN_NUMBER" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-results
