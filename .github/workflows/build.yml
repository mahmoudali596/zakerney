name: Build Zakerney APK
on: [push, workflow_dispatch]
env:
  SRC: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack source
        run: |
          echo "$SRC" | base64 -d | tar xJ
          python3 zakerney/tool/gen_alarm.py zakerney/assets/sounds/alarm.wav
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - name: Build
        working-directory: zakerney
        run: |
          bash setup.sh
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle*
          sed -i 's#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>#&\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>#' android/app/src/main/AndroidManifest.xml
          grep -n EXACT android/app/src/main/AndroidManifest.xml
          for i in 1 2 3 4; do flutter build apk --release && break; echo "retry $i"; sleep 30; done
          test -f build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zakerney-apk
          path: zakerney/build/app/outputs/flutter-apk/app-release.apk
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unpack source
        run: |
          echo "$SRC" | base64 -d | tar xJ
          python3 zakerney/tool/gen_alarm.py zakerney/assets/sounds/alarm.wav
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - name: Prepare tests
        working-directory: zakerney
        run: |
          bash setup.sh
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle*
          sed -i 's#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>#&\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>#' android/app/src/main/AndroidManifest.xml
          grep -n EXACT android/app/src/main/AndroidManifest.xml
          printf '\ndev_dependencies:\n  flutter_test:\n    sdk: flutter\n  integration_test:\n    sdk: flutter\n' >> pubspec.yaml
          mkdir -p integration_test test_driver
          cat > integration_test/app_test.dart <<'EOF'
          import 'dart:convert';

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:integration_test/integration_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:zakerney/main.dart' as app;
          import 'package:zakerney/cloud.dart';
          import 'package:zakerney/firebase_config.dart';
          import 'package:zakerney/store.dart';

          String hm(DateTime d) => '${d.hour.toString().padLeft(2, '0')}:${d.minute.toString().padLeft(2, '0')}';

          Future<void> pumpFor(WidgetTester t, int ms) async {
            for (var i = 0; i < ms ~/ 100; i++) {
              await t.pump(const Duration(milliseconds: 100));
            }
          }

          Future<void> waitFor(WidgetTester t, Finder f, {int seconds = 40}) async {
            for (var i = 0; i < seconds * 10; i++) {
              await t.pump(const Duration(milliseconds: 100));
              if (f.evaluate().isNotEmpty) return;
            }
            throw TestFailure('Timed out waiting for $f');
          }

          Finder get vScroll => find.byWidgetPredicate((w) => w is Scrollable && (w.axisDirection == AxisDirection.down || w.axisDirection == AxisDirection.up)).first;

          Future<void> reveal(WidgetTester t, Finder f, {double dy = 250}) async {
            await t.scrollUntilVisible(f, dy, scrollable: vScroll, maxScrolls: 30);
            await pumpFor(t, 300);
          }

          void step(String s) => debugPrint('E2E STEP: $s');

          void main() {
            final binding = IntegrationTestWidgetsFlutterBinding.ensureInitialized();

            Future<void> shot(WidgetTester t, String name) async {
              await pumpFor(t, 600);
              await binding.takeScreenshot(name);
              step('screenshot $name');
            }

            testWidgets('Zakerney end-to-end', (t) async {
              final now = DateTime.now();
              final past = now.subtract(const Duration(days: 2)).toIso8601String();
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('state', jsonEncode({
                'meds': [
                  {'id': 'm1', 'name': 'دواء الضغط', 'dose': '5 مجم - قرص واحد', 'instructions': 'بعد الفطار مع كوب مية', 'imageFile': null,
                   'times': [hm(now.subtract(const Duration(minutes: 1)))], 'snoozeMinutes': 5, 'maxAlerts': 3, 'activeFrom': past},
                  {'id': 'm2', 'name': 'دواء الذاكرة', 'dose': '10 مجم', 'instructions': 'بعد الغدا', 'imageFile': null,
                   'times': [hm(now.subtract(const Duration(minutes: 40)))], 'snoozeMinutes': 5, 'maxAlerts': 3, 'activeFrom': past},
                  {'id': 'm3', 'name': 'فيتامين د', 'dose': 'كبسولة', 'instructions': 'قبل النوم', 'imageFile': null,
                   'times': [hm(now.add(const Duration(hours: 3)))], 'snoozeMinutes': 10, 'maxAlerts': 2, 'activeFrom': past},
                ],
                'confirmed': {}, 'missLogged': [], 'logs': [],
                'pin': '1234', 'patientName': 'محمد', 'caregiverName': 'عمر', 'caregiverPhone': '01000000000',
              }));

              await binding.convertFlutterSurfaceToImage();
              app.main();

              step('waiting for alarm screen');
              await waitFor(t, find.textContaining('حان موعد الدواء'));
              expect(find.text('دواء الضغط'), findsWidgets);
              await shot(t, '01_alarm');

              step('missed dose logged');
              expect(appState.logs.any((l) => l.kind == 'miss' && l.text.contains('دواء الذاكرة')), isTrue);

              step('confirm dose');
              await t.tap(find.text('أخذت الدواء').last);
              await waitFor(t, find.textContaining('تم تسجيل الجرعة'));
              expect(appState.logs.any((l) => l.kind == 'ok' && l.text.contains('دواء الضغط')), isTrue);
              await pumpFor(t, 2500);
              expect(find.textContaining('حان موعد الدواء'), findsNothing);
              await reveal(t, find.text('تم التأكيد'));
              expect(find.text('تم التأكيد'), findsWidgets);
              await reveal(t, find.text('لم يتم التأكيد'));
              expect(find.text('لم يتم التأكيد'), findsWidgets);
              await shot(t, '02_patient_home');

              step('help button');
              await reveal(t, find.text('أحتاج مساعدة'), dy: -250);
              await t.tap(find.text('أحتاج مساعدة'));
              await pumpFor(t, 1200);
              expect(find.text('01000000000'), findsOneWidget);
              await shot(t, '03_help');
              await t.tap(find.text('رجوع'));
              await pumpFor(t, 1000);

              step('family mode wrong pin');
              await t.tap(find.byTooltip('وضع الأسرة'));
              await pumpFor(t, 1500);
              await t.enterText(find.byType(TextField), '0000');
              await t.tap(find.text('دخول'));
              await pumpFor(t, 800);
              expect(find.text('الرمز غير صحيح'), findsOneWidget);

              step('family mode right pin');
              await t.enterText(find.byType(TextField), '1234');
              await t.tap(find.text('دخول'));
              await pumpFor(t, 1500);
              await reveal(t, find.text('فيتامين د'));
              expect(find.text('فيتامين د'), findsWidgets);
              await shot(t, '04_family_meds');

              step('log tab');
              await t.tap(find.text('السجل'));
              await pumpFor(t, 1500);
              await shot(t, '05_family_log');

              step('add medication');
              await t.tap(find.text('الأدوية').first);
              await pumpFor(t, 800);
              await reveal(t, find.text('إضافة دواء'), dy: -250);
              await pumpFor(t, 1000);
              await t.tap(find.text('إضافة دواء').first);
              await pumpFor(t, 1500);
              await t.enterText(find.widgetWithText(TextFormField, 'اسم الدواء'), 'دواء السكر');
              await t.enterText(find.widgetWithText(TextFormField, 'التركيز والكمية'), '500 مجم');
              await reveal(t, find.text('إضافة موعد'));
              await t.tap(find.text('إضافة موعد'));
              await pumpFor(t, 1500);
              await shot(t, '06_time_picker');
              await t.tap(find.byType(TextButton).last);
              await pumpFor(t, 1000);
              await shot(t, '07_med_editor');
              await reveal(t, find.text('حفظ الدواء'));
              await t.tap(find.text('حفظ الدواء'));
              await pumpFor(t, 1500);
              expect(appState.meds.length, 4);
              expect(appState.meds.any((m) => m.name == 'دواء السكر' && m.times.isNotEmpty), isTrue);
              await shot(t, '08_family_meds_after_add');

              // ---------------- cloud: link a second (family) device through Firebase ----------------
              step('open pairing screen');
              await t.tap(find.text('الإعدادات'));
              await pumpFor(t, 1200);
              await reveal(t, find.text('ربط موبايل الأسرة'));
              await t.tap(find.text('ربط موبايل الأسرة'));
              await waitFor(t, find.textContaining('اكتب الكود ده'), seconds: 60);
              final code = t.widget<SelectableText>(find.byType(SelectableText).first).data!;
              step('pairing code $code, patientDocId ${appState.patientDocId}');
              await shot(t, '09_pair_code');

              step('family device joins');
              final famApp = await Firebase.initializeApp(name: 'family', options: firebaseOptions);
              final famAuth = FirebaseAuth.instanceFor(app: famApp);
              final famUid = (await famAuth.signInAnonymously()).user!.uid;
              final famDb = FirebaseFirestore.instanceFor(app: famApp);
              final pairing = await famDb.collection('pairing').doc(code).get();
              final pid = pairing.data()!['patientId'] as String;
              expect(pid, appState.patientDocId);
              await famDb.collection('pairing').doc(code).update({'familyUid': famUid, 'familyName': 'اختبار'});
              await waitFor(t, find.textContaining('تم ربط موبايل'), seconds: 60);
              await shot(t, '10_paired');

              step('family reads and edits medications');
              final pdoc = await famDb.collection('patients').doc(pid).get();
              final remoteMeds = (pdoc.data()!['meds'] as List).map((e) => Map<String, dynamic>.from(e as Map)).toList();
              expect(remoteMeds.length, 4);
              remoteMeds.add({
                'id': 'fam1', 'name': 'دواء من الأسرة', 'dose': 'قرص', 'instructions': 'بعد العشا', 'imageVersion': 0,
                'times': ['08:00'], 'snoozeMinutes': 5, 'maxAlerts': 3, 'activeFrom': DateTime.now().toIso8601String(),
              });
              await famDb.collection('patients').doc(pid).update({'meds': remoteMeds, 'medsUpdatedBy': famUid});
              for (var i = 0; i < 300 && !appState.meds.any((m) => m.name == 'دواء من الأسرة'); i++) {
                await t.pump(const Duration(milliseconds: 100));
              }
              expect(appState.meds.any((m) => m.name == 'دواء من الأسرة'), isTrue);

              step('patient event reaches family');
              Cloud.pushEvent(appState, 'help', 'اختبار مساعدة');
              var got = false;
              for (var i = 0; i < 60 && !got; i++) {
                await t.pump(const Duration(milliseconds: 500));
                final q = await famDb.collection('patients').doc(pid).collection('events').get();
                got = q.docs.any((d) => d.data()['text'] == 'اختبار مساعدة');
              }
              expect(got, isTrue);

              step('stranger cannot read');
              final strangerApp = await Firebase.initializeApp(name: 'stranger', options: firebaseOptions);
              await FirebaseAuth.instanceFor(app: strangerApp).signInAnonymously();
              var denied = false;
              try {
                await FirebaseFirestore.instanceFor(app: strangerApp).collection('patients').doc(pid).get(const GetOptions(source: Source.server));
              } catch (e) {
                denied = true;
              }
              expect(denied, isTrue);
              step('CLOUD CHECKS PASSED');
              step('ALL CHECKS PASSED');
            });
          }
          EOF
          cat > test_driver/integration_test.dart <<'EOF'
          import 'dart:io';

          import 'package:integration_test/integration_test_driver_extended.dart';

          Future<void> main() => integrationDriver(
                onScreenshot: (String name, List<int> bytes, [Map<String, Object?>? args]) async {
                  final f = File('screenshots/$name.png');
                  await f.create(recursive: true);
                  await f.writeAsBytes(bytes);
                  return true;
                },
              );
          EOF
          cat > tool/run_e2e.sh <<'EOF'
          cd zakerney
          adb shell settings put global window_animation_scale 0
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart 2>&1 | tee drive.log
          status=${PIPESTATUS[0]}
          adb logcat -d > logcat.txt
          mkdir -p screenshots
          cp drive.log logcat.txt screenshots/
          grep -c "FATAL EXCEPTION" logcat.txt > screenshots/crash_count.txt || true
          exit $status
          EOF
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          for i in 1 2 3 4; do flutter build apk --debug && break; echo "retry $i"; sleep 30; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash zakerney/tool/run_e2e.sh
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p zakerney/screenshots && cd zakerney/screenshots
          git init -q && git checkout -q -b test-results
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Test results $GITHUB_RUN_NUMBER" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-results
